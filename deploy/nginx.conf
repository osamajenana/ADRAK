# adrak.madafa.net
#
# One origin serves both halves: the built PWA at /, and Laravel at /api. Same-origin is not a
# convenience here — a cross-origin API would mean CORS preflights, and a preflight is an extra
# round trip before every single request on a connection where round trips are the scarce resource.
#
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/adrak
#           sudo ln -s /etc/nginx/sites-available/adrak /etc/nginx/sites-enabled/adrak
#           sudo nginx -t && sudo systemctl reload nginx
#
# TLS is added by certbot (see deploy/README.md); it rewrites this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name adrak.madafa.net;

    # Everything below is served over HTTPS in the end. The service worker — and therefore the
    # entire offline capability — requires a secure context, so plain HTTP is a redirect only.
    root /var/www/adrak/web/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 8M;

    # ---------------------------------------------------------------- compression
    # The bundle is ~118 KB gzipped and the audience is on 2G. Brotli would be better still; gzip
    # is what ships with stock nginx, and a working default beats a better one that needs a module.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/manifest+json
        image/svg+xml;

    # ---------------------------------------------------------------- the API
    location /api {
        alias /var/www/adrak/api/public;
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        fastcgi_pass unix:/run/php/adrak.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/adrak/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # $request_uri, not $uri: Laravel routes on the original path, and the alias above has
        # already rewritten $uri to a filesystem-relative one.
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
    }

    location = /up {
        fastcgi_pass unix:/run/php/adrak.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/adrak/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # ---------------------------------------------------------------- the PWA
    # Hashed assets are immutable, so they are cached hard. A student on a metered connection should
    # never pay for the same bytes twice.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # NEVER cached. It is how a device learns there is a new version at all, and a stale one pins a
    # student to an old build until they clear site data — which they will not do.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Client-side routes: /practice/FRC.ADD.UNLIKE is a screen, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------- hygiene
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/adrak.access.log;
    error_log /var/log/nginx/adrak.error.log;
}
