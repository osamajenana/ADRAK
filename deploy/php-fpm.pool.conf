; ADRAK's own PHP-FPM pool.
;
; Install:  sudo cp deploy/php-fpm.pool.conf /etc/php/8.3/fpm/pool.d/adrak.conf
;           sudo php-fpm8.3 -t && sudo systemctl reload php8.3-fpm
;
; This exists because of what a shared box actually looks like. The default [www] pool on the
; server this deploys to carries ten unrelated production sites on pm.max_children = 5. Adding an
; eleventh tenant to that pool means a classroom of thirty students syncing at the end of a lesson
; can occupy every worker on the machine - and the site that starts returning 502 is a dental
; clinic whose logs say nothing about ADRAK. A pool is the boundary that makes that impossible:
; these children are ours, and the count below is the worst we can cost anyone else.
[adrak]

user = www-data
group = www-data

listen = /run/php/adrak.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Recycle workers. A leak in our code is our problem until a worker lives long enough to make it
; the whole machine's problem.
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[error_log] = /var/log/php8.3-fpm-adrak.log
php_admin_flag[log_errors] = on
