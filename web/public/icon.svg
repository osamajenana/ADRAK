<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="nabd-mark-title">
  <title id="nabd-mark-title">نبض</title>
  <!--
    The mark is a single pulse line read right-to-left, like the language.
    It begins on a low resting baseline (y=40) and ends on a higher one (y=28):
    the beat does not return the line to where it started, it lifts it.
    That is the product in one stroke — a learning curve drawn as a heartbeat.
  -->
  <defs>
    <linearGradient id="nabd-pulse" x1="58" y1="40" x2="6" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#128884"/>
      <stop offset="0.55" stop-color="#1CA9A3"/>
      <stop offset="1" stop-color="#71DED4"/>
    </linearGradient>
  </defs>
  <path
    d="M58 40 H46 L41.5 44.5 L35 16 L29.5 44.5 L24 28 H6"
    fill="none"
    stroke="url(#nabd-pulse)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
