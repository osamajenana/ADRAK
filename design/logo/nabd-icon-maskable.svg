<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="nabd-icon-title">
  <title id="nabd-icon-title">نبض</title>
  <!--
    Maskable PWA icon. Android crops installed icons to a platform-chosen shape (circle, squircle,
    teardrop), keeping only the inner 80% safe zone — a circle of radius 205 around (256, 256).
    The pulse is scaled to sit entirely inside that circle so no launcher shape can clip the beat.
    Background is solid, not a gradient: it is what shows through on every crop.
  -->
  <defs>
    <linearGradient id="nabd-icon-pulse" x1="440" y1="288" x2="72" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#71DED4"/>
      <stop offset="0.55" stop-color="#A9EDE5"/>
      <stop offset="1" stop-color="#D3F6F1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#052C2D"/>

  <path
    d="M400 288 H328 L301 315 L262 144 L229 315 L196 216 H112"
    fill="none"
    stroke="url(#nabd-icon-pulse)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
